<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROYECT MANAGER - Panel de Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestión de Proyectos</h1>
        </header>

        <!-- Formulario para agregar nuevos proyectos -->
        <section class="card">
            <h2>Crear Nuevo Proyecto</h2>
            <form action="/crear-proyecto" method="POST" class="form-grid">
                <div class="form-group">
                    <label for="nombre">Nombre del Proyecto:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Sistema Web">
                </div>
                
                <div class="form-group">
                    <label for="fecha_inicio">Fecha de Inicio:</label>
                    <input type="date" id="fecha_inicio" name="fecha_inicio" required>
                </div>

                <div class="form-group full-width">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="3" placeholder="Detalles del proyecto..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Guardar Proyecto</button>
            </form>
        </section>

        <!-- Tabla dinámica con la información de PostgreSQL -->
        <section class="card">
            <h2>Proyectos Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Fecha Inicio</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in proyectos %}
                    <tr>
                        <td>{{ p[0] }}</td>
                        <td><strong>{{ p[1] }}</strong></td>
                        <td>{{ p[2] }}</td>
                        <td>{{ p[3] }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="empty-msg">No hay proyectos registrados aún.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
